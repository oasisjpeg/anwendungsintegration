name: WattWise Frontend Validation

on:
  # Only run on pull requests to minimize risk
  pull_request:
    branches: [ main, master, develop ]
  # Allow manual triggering for testing
  workflow_dispatch:

    
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run ESLint
        # Use continue-on-error to see all issues without failing the workflow
        continue-on-error: true
        run: npm run lint

  build:
    name: Verify Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build Next.js app (verification only)
        run: npm run build
        
      - name: Report success
        run: echo "✅ Build completed successfully. No deployment will occur in validation mode."
