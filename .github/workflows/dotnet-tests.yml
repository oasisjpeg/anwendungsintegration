name: .NET Tests

on:
  push:
    branches: [ main, master, develop, testing-actions ]
    paths:
      - 'backend/api_backend/**'
  pull_request:
    branches: [ main, master, develop, testing-actions ]
    paths:
      - 'backend/api_backend/**'
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore api.sln
      working-directory: backend/api_backend
      
    - name: Build
      run: dotnet build api.sln --no-restore
      working-directory: backend/api_backend
      
    - name: Run Tests
      run: dotnet test api.sln --no-build --verbosity normal
      working-directory: backend/api_backend
      
    - name: Report test results
      if: always()
      run: echo "✅ Tests completed. Check the logs for any failures."
